<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Vehicle Recycling Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .component-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        .component-card:hover {
            transform: scale(1.05);
        }
        .recycling-bin {
            min-height: 200px;
            border: 2px dashed #ccc;
            margin: 20px 0;
            padding: 20px;
            text-align: center;
        }
        .score-display {
            font-size: 24px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="text-center mb-4">Eco Vehicle Recycling Challenge</h1>
        
        <div class="score-display text-center">
            Score: <span id="score">0</span>
        </div>
        
        <div class="row" id="component-list">
            <!-- Components will be dynamically added here -->
        </div>
        
        <div class="recycling-bin" id="recycling-bin">
            <h3>Drop Components Here</h3>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const components = [
            {
                name: 'Lithium-ion Battery',
                type: 'hazardous',
                points: 100,
                recyclable: true,
                description: 'Must be properly disposed of at specialized facilities'
            },
            {
                name: 'Electric Motor',
                type: 'metal',
                points: 75,
                recyclable: true,
                description: 'Contains valuable metals that can be recovered'
            },
            {
                name: 'Solar Panels',
                type: 'electronic',
                points: 85,
                recyclable: true,
                description: 'Can be recycled to recover silicon and other materials'
            },
            {
                name: 'Brake Pads',
                type: 'composite',
                points: 50,
                recyclable: false,
                description: 'Must be replaced and properly disposed of'
            }
        ];

        let score = 0;
        
        function createComponentCard(component) {
            const card = document.createElement('div');
            card.className = 'col-md-6 mb-3';
            card.innerHTML = `
                <div class="card component-card" draggable="true" data-component='${JSON.stringify(component)}'>
                    <div class="card-body">
                        <h5 class="card-title">${component.name}</h5>
                        <p class="card-text">${component.description}</p>
                    </div>
                </div>
            `;
            
            card.querySelector('.component-card').addEventListener('dragstart', handleDragStart);
            return card;
        }
        
        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.component);
        }
        
        function initGame() {
            const componentList = document.getElementById('component-list');
            components.forEach(component => {
                componentList.appendChild(createComponentCard(component));
            });
            
            const recyclingBin = document.getElementById('recycling-bin');
            recyclingBin.addEventListener('dragover', e => e.preventDefault());
            recyclingBin.addEventListener('drop', handleDrop);
        }
        
        function handleDrop(e) {
            e.preventDefault();
            const component = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (component.recyclable) {
                score += component.points;
                document.getElementById('score').textContent = score;
                showFeedback(`Great job! ${component.name} can be recycled.`, 'success');
            } else {
                showFeedback(`${component.name} needs special disposal.`, 'danger');
            }
        }
        
        function showFeedback(message, type) {
            const feedback = document.createElement('div');
            feedback.className = `alert alert-${type} mt-3`;
            feedback.textContent = message;
            document.querySelector('.game-container').appendChild(feedback);
            setTimeout(() => feedback.remove(), 3000);
        }
        
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
