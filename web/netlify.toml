[build]
  command = "npm run build"
  publish = ".next"

# CG4L Eco-Vehicle Site Redirects
[[redirects]]
  from = "https://www.cg4l.online/*"
  to = "https://cg4l.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ev.cg4l.online/*"
  to = "/ev/:splat"
  status = 200

[[redirects]]
