network:
  version: 2
  renderer: networkd
  ethernets:
    eno1:  # First ethernet interface
      dhcp4: no
    eno2:  # Second ethernet interface
      dhcp4: no
  bonds:
    bond0:
      interfaces: [eno1, eno2]
      addresses: [192.168.2.4/24]
      gateway4: 192.168.2.1
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
      parameters:
        mode: 802.3ad  # IEEE 802.3ad LACP
        lacp-rate: fast
        mii-monitor-interval: 100
        transmit-hash-policy: layer2+3
